name: Flic Twist
service: Flic
event_type: event_entity
identifier_key: device_id
info: Flic integration (flic_button), Default or Continuous push twist mode. Identifier is the Home Assistant device id of the Twist. Selector mode exposes different event types.
buttons:
  - x: 0
    y: 0
    width: 100
    height: 100
    actions:
      - title: press
        conditions:
          - key: event_type
            value: click
      - title: press 2x
        conditions:
          - key: event_type
            value: double_click
      - title: hold
        conditions:
          - key: event_type
            value: hold
      - title: button down
        conditions:
          - key: event_type
            value: down
      - title: button up
        conditions:
          - key: event_type
            value: up
      - title: twist clockwise
        conditions:
          - key: event_type
            value: twist_increment
      - title: twist counter-clockwise
        conditions:
          - key: event_type
            value: twist_decrement
      - title: push-twist clockwise
        conditions:
          - key: event_type
            value: push_twist_increment
      - title: push-twist counter-clockwise
        conditions:
          - key: event_type
            value: push_twist_decrement
